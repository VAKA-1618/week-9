    <script>
        let n = Number(prompt("Enter a number:"));
        let temp = n;
        let count = 0;
        let sum = 0;

        while (temp != 0) {
            count++;
            temp = Math.floor(temp / 10);
        }

        temp = n;
        while (temp != 0) {
            let digit = temp % 10;
            sum = sum + Math.pow(digit, count);
            temp = Math.floor(temp / 10);
        }

        if (sum == n && n >= 0) {
            document.write("It is an Armstrong number");
        } else {
            document.write("It is not an Armstrong number");
        }
    </script>
