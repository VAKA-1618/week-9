
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prime Number</title>
</head>
<body>
    <script>
        let n = Number(prompt("Enter a number:"));
        let prime = 1;

        if (n <= 1) {
            prime = 0;
        } else {
            for (let j = 2; j <= n / 2; j++) {
                if (n % j == 0) {
                    prime = 0;
                    break;
                }
            }
        }

        if (prime == 1) {
            document.write("It is a prime number");
        } else {
            document.write("It is not a prime number");
        }
    </script>
</body>
</html>
