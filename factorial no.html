
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Number</title>
</head>
<body>
    <script>
        let n = Number(prompt("Enter a number:"));
        let fact = 1;

        for (let i = 1; i <= n; i++) {
            fact *= i;
        }

        document.write("Factorial = " + fact);
    </script>
</body>
</html>
