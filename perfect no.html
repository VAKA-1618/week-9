    <script>
        let n = Number(prompt("Enter a number:"));
        let sum = 0;

        for (let i = 1; i <= n / 2; i++) {
            if (n % i == 0) {
                sum += i;
            }
        }

        if (sum == n && n > 0) {
            document.write("It is a perfect number");
        } else {
            document.write("It is not a perfect number");
        }
    </script>
